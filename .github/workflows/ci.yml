name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Native host bridge
        run: node --test shellagent/*.test.mjs
      - name: Windows build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-H=windowsgui" ./...
          go test -c -o /dev/null ./shellagent/
          go test -c -o /dev/null .

  windows-native:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Native Windows integration
        run: go test ./shellagent ./shellagent/winhost ./shellagent/desktop -run 'NativeWindows|QueueOpenFiles|NativeOpen|PNGToICO|WindowsApp|EncodedPowerShell|UserCommand' -count=1
      - name: Background helpers do not allocate consoles
        run: go test ./shellagent/proc -count=1
      - name: WebView2 native file drop paths
        run: go test ./shellagent/winhost -run NativeWindowsDrop -count=1
      - name: Real WebView2 file objects
        env:
          DYNAPP_TEST_WEBVIEW2: "1"
        run: go test ./shellagent/winhost -run '^TestNativeWindowsDropWebView2$' -count=1 -timeout 90s
      - name: Console trace script smoke test
        run: ./scripts/trace-windows-consoles.ps1 -DurationSeconds 1
      - name: Windows desktop and CLI startup
        run: go test . -run 'WindowsConsole|WindowsGUI' -count=1
      - name: Windows file associations
        run: go test ./shellagent/assoc -count=1

  release:
    needs: [test, windows-native]
    if: github.event_name == 'push' && !github.event.repository.fork && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !contains(github.event.head_commit.message, '[skip release]')
    permissions:
      contents: write
      pages: write
    secrets: inherit
    uses: ./.github/workflows/release.yml
    with:
      optional: true
