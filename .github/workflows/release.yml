name: release

# Manual-only. Tests and publishes the distributable `dynapp-shell-agent`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp, without a v prefix. Empty patch-bumps the latest v* tag.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: agent-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: compute
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          prev="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -n "${INPUT_VERSION:-}" ]; then
            next="${INPUT_VERSION#v}"
          elif [ -z "$prev" ]; then
            next="0.1.0"
          else
            base="${prev#v}"
            major="${base%%.*}"
            rest="${base#*.}"
            minor="${rest%%.*}"
            patch="${rest##*.}"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${prev:-<none>} -> agent $next"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  create-release:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release tag if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DynApp Agent ${VERSION}" \
            --generate-notes

  binaries:
    needs: [version, create-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build agent
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          asset="dynapp-shell-agent-${VERSION}-${GOOS}-${GOARCH}${suffix}"
          GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -X github.com/amitbet/dynapp-agent.AgentVersion=${VERSION} -X github.com/amitbet/dynapp-agent.AgentRepository=${REPOSITORY}" \
            -o "$asset" ./cmd/dynapp-shell-agent
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign agent asset with the payload signing key
        shell: bash
        env:
          PAINTJS_PAYLOAD_SIGNING_KEY: ${{ secrets.PAINTJS_PAYLOAD_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PAINTJS_PAYLOAD_SIGNING_KEY" ]; then
            echo "PAINTJS_PAYLOAD_SIGNING_KEY is not configured; the agent updater requires a .sig asset" >&2
            exit 1
          fi
          node - "$asset" <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const asset = process.argv[2];
          const raw = process.env.PAINTJS_PAYLOAD_SIGNING_KEY.trim();
          const pem = raw.includes("BEGIN") ? raw : Buffer.from(raw, "base64").toString("utf8");
          const key = crypto.createPrivateKey(pem);
          const digest = crypto.createHash("sha256").update(fs.readFileSync(asset)).digest("hex");
          const signature = crypto.sign(null, Buffer.from(digest, "ascii"), key).toString("base64");
          fs.writeFileSync(`${asset}.sig`, signature + "\n");
          const pub = crypto.createPublicKey(key);
          if (!crypto.verify(null, Buffer.from(digest, "ascii"), pub, Buffer.from(signature, "base64"))) {
            throw new Error("signature self-check failed");
          }
          console.log(`signed ${asset} (${digest})`);
          NODE
      - name: Upload agent assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s "$asset.sig"
          gh release upload "v${VERSION}" "$asset" "$asset.sha256" "$asset.sig" --repo "$REPOSITORY" --clobber

  macos:
    needs: [version, create-release]
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Restore persistent macOS signing identity
        shell: bash
        env:
          MACOS_CODESIGN_P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CODESIGN_P12_BASE64" ] || [ -z "$MACOS_CODESIGN_P12_PASSWORD" ]; then
            echo "MACOS_CODESIGN_P12_BASE64 / MACOS_CODESIGN_P12_PASSWORD are not configured" >&2
            exit 1
          fi
          mkdir -p keys
          printf '%s' "$MACOS_CODESIGN_P12_BASE64" | base64 --decode > keys/macos-codesign.p12
          printf '%s' "$MACOS_CODESIGN_P12_PASSWORD" > keys/macos-codesign.pass
          chmod 600 keys/macos-codesign.p12 keys/macos-codesign.pass
      - name: Build and sign agent
        shell: bash
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset="dynapp-shell-agent-${VERSION}-darwin-${GOARCH}"
          GOOS=darwin GOARCH="$GOARCH" CGO_ENABLED=1 \
            go build -trimpath -ldflags="-s -w -X github.com/amitbet/dynapp-agent.AgentVersion=${VERSION} -X github.com/amitbet/dynapp-agent.AgentRepository=${REPOSITORY}" \
            -o "$asset" ./cmd/dynapp-shell-agent
          MACOS_CODESIGN_IDENTIFIER="com.amitbet.dynapp.shell-agent" \
            node scripts/sign-macos-binary.mjs "$asset"
          codesign --verify --strict --verbose=2 "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign agent asset with the payload signing key
        shell: bash
        env:
          PAINTJS_PAYLOAD_SIGNING_KEY: ${{ secrets.PAINTJS_PAYLOAD_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PAINTJS_PAYLOAD_SIGNING_KEY" ]; then
            echo "PAINTJS_PAYLOAD_SIGNING_KEY is not configured; the agent updater requires a .sig asset" >&2
            exit 1
          fi
          node - "$asset" <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const asset = process.argv[2];
          const raw = process.env.PAINTJS_PAYLOAD_SIGNING_KEY.trim();
          const pem = raw.includes("BEGIN") ? raw : Buffer.from(raw, "base64").toString("utf8");
          const key = crypto.createPrivateKey(pem);
          const digest = crypto.createHash("sha256").update(fs.readFileSync(asset)).digest("hex");
          const signature = crypto.sign(null, Buffer.from(digest, "ascii"), key).toString("base64");
          fs.writeFileSync(`${asset}.sig`, signature + "\n");
          const pub = crypto.createPublicKey(key);
          if (!crypto.verify(null, Buffer.from(digest, "ascii"), pub, Buffer.from(signature, "base64"))) {
            throw new Error("signature self-check failed");
          }
          console.log(`signed ${asset} (${digest})`);
          NODE
      - name: Upload agent assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s "$asset.sig"
          gh release upload "v${VERSION}" "$asset" "$asset.sha256" "$asset.sig" --repo "$REPOSITORY" --clobber
