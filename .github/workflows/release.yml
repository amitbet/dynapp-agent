name: release

# Builds signed `dynapp-shell-agent` binaries for macOS, Windows, and Linux
# and publishes them to a GitHub release. Triggered by a successful CI run on
# the default branch, a v* tag, or the Actions tab.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp, without a v prefix. Empty patch-bumps the latest v* tag.
        required: false
        type: string
  workflow_call:
    inputs:
      optional:
        description: Skip publishing instead of failing when signing secrets are missing. CI sets this so a missing secret does not fail tests.
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: agent-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release secrets
        id: secrets
        env:
          HAS_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY != '' }}
          HAS_P12: ${{ secrets.MACOS_CODESIGN_P12_BASE64 != '' }}
          HAS_PASS: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD != '' }}
          OPTIONAL: ${{ inputs.optional }}
        run: |
          set -euo pipefail
          missing=0
          if [ "$HAS_SIGNING_KEY" != true ]; then
            echo "Missing secret RELEASE_SIGNING_KEY" >&2
            missing=1
          fi
          if [ "$HAS_P12" != true ]; then
            echo "Missing secret MACOS_CODESIGN_P12_BASE64" >&2
            missing=1
          fi
          if [ "$HAS_PASS" != true ]; then
            echo "Missing secret MACOS_CODESIGN_P12_PASSWORD" >&2
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Set RELEASE_SIGNING_KEY and the macOS codesign secrets (Settings → Secrets and variables → Actions)." >&2
            if [ "$OPTIONAL" = true ]; then
              echo "Signing secrets are not configured; skipping publish so CI can stay green."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - id: compute
        if: steps.secrets.outputs.ready == 'true'
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          prev="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            next="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            next="${INPUT_VERSION#v}"
          elif [ -z "$prev" ]; then
            next="0.1.0"
          else
            base="${prev#v}"
            major="${base%%.*}"
            rest="${base#*.}"
            minor="${rest%%.*}"
            patch="${rest##*.}"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${prev:-<none>} -> agent $next"

  test:
    needs: version
    if: needs.version.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  create-release:
    needs: [version, test]
    if: needs.version.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DynApp Agent ${VERSION}" \
            --generate-notes

  binaries:
    needs: [version, create-release]
    if: needs.version.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build agent
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          asset="dynapp-shell-agent-${VERSION}-${GOOS}-${GOARCH}${suffix}"
          GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -X github.com/amitbet/dynapp-agent/shellagent.AgentVersion=${VERSION} -X github.com/amitbet/dynapp-agent/shellagent.AgentRepository=${REPOSITORY}" \
            -o "$asset" .
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_ENV"
      - name: Sign release asset
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release-asset.mjs "$asset"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s "$asset.sig"
          gh release upload "v${VERSION}" "$asset" "$asset.sha256" "$asset.sig" --repo "$REPOSITORY" --clobber

  macos:
    needs: [version, create-release]
    if: needs.version.outputs.ready == 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore persistent macOS signing identity
        env:
          MACOS_CODESIGN_P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keys
          printf '%s' "$MACOS_CODESIGN_P12_BASE64" | base64 --decode > keys/macos-codesign.p12
          printf '%s' "$MACOS_CODESIGN_P12_PASSWORD" > keys/macos-codesign.pass
          chmod 600 keys/macos-codesign.p12 keys/macos-codesign.pass
      - name: Build and codesign agent
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset="dynapp-shell-agent-${VERSION}-darwin-${GOARCH}"
          GOOS=darwin GOARCH="$GOARCH" CGO_ENABLED=1 \
            go build -trimpath -ldflags="-s -w -X github.com/amitbet/dynapp-agent/shellagent.AgentVersion=${VERSION} -X github.com/amitbet/dynapp-agent/shellagent.AgentRepository=${REPOSITORY}" \
            -o "$asset" .
          MACOS_CODESIGN_IDENTIFIER="com.amitbet.dynapp.shell-agent" \
            node scripts/sign-macos-binary.mjs "$asset"
          codesign --verify --strict --verbose=2 "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_ENV"
      - name: Sign release asset
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release-asset.mjs "$asset"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s "$asset.sig"
          gh release upload "v${VERSION}" "$asset" "$asset.sha256" "$asset.sig" --repo "$REPOSITORY" --clobber

  packages:
    needs: [version, binaries, macos]
    if: needs.version.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download signed binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist apt-repo
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'dynapp-shell-agent-*'
      - name: Build Debian packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y dpkg-dev
          chmod +x scripts/package-deb.sh scripts/publish-apt-repo.sh
          for arch in amd64 arm64; do
            ./scripts/package-deb.sh "dist/dynapp-shell-agent-${VERSION}-linux-${arch}" "$VERSION" "$arch"
          done
          mv dynapp-shell-agent_"${VERSION}"_amd64.deb dynapp-shell-agent_"${VERSION}"_arm64.deb apt-repo/
          ./scripts/publish-apt-repo.sh apt-repo
          cd apt-repo
          for deb in *.deb; do
            sha256sum "$deb" > "$deb.sha256"
            node ../scripts/sign-release-asset.mjs "$deb"
          done
      - name: Upload Debian packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" apt-repo/*.deb apt-repo/*.deb.sha256 apt-repo/*.deb.sig --repo "$REPOSITORY" --clobber
      - name: Update package manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/bump-homebrew-formula.mjs "$VERSION" dist
          node scripts/bump-winget-manifest.mjs "$VERSION" dist
      - name: Assemble GitHub Pages
        run: |
          set -euo pipefail
          mkdir -p pages/deb pages/winget
          cp -a apt-repo/. pages/deb/
          cp winget/*.yaml pages/winget/
      - name: Publish apt and winget pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: pages
          force_orphan: true
      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" --input - <<'EOF' >/dev/null || true
{"source":{"branch":"gh-pages","path":"/"}}
EOF
      - name: Commit package manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/dynapp-shell-agent.rb winget; then
            echo "Package manifests already match ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dynapp-shell-agent.rb winget
          git commit -m "Bump package manifests to ${VERSION} [skip release]"
          git push origin HEAD:${{ github.event.repository.default_branch }}

  summary:
    needs: [version, binaries, macos, packages]
    if: needs.version.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: List published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets \
            --jq '{tag:.tagName, url:.url, assets:[.assets[].name]}'
