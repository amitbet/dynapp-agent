name: release

# Builds signed `dynapp-shell-agent` binaries for macOS, Windows, and Linux
# and publishes them to a GitHub release. Triggered by a successful CI run on
# the default branch, a v* tag, or the Actions tab.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp, without a v prefix. Empty patch-bumps the latest v* tag.
        required: false
        type: string
  workflow_call:
    inputs:
      optional:
        description: Skip publishing instead of failing when signing secrets are missing. CI sets this so a missing secret does not fail tests.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agent-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require release secrets
        id: secrets
        env:
          HAS_PAYLOAD: ${{ secrets.PAINTJS_PAYLOAD_SIGNING_KEY != '' }}
          HAS_P12: ${{ secrets.MACOS_CODESIGN_P12_BASE64 != '' }}
          HAS_PASS: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD != '' }}
          OPTIONAL: ${{ inputs.optional }}
        run: |
          set -euo pipefail
          missing=0
          if [ "$HAS_PAYLOAD" != true ]; then
            echo "Missing secret PAINTJS_PAYLOAD_SIGNING_KEY" >&2
            missing=1
          fi
          if [ "$HAS_P12" != true ]; then
            echo "Missing secret MACOS_CODESIGN_P12_BASE64" >&2
            missing=1
          fi
          if [ "$HAS_PASS" != true ]; then
            echo "Missing secret MACOS_CODESIGN_P12_PASSWORD" >&2
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Copy these from amitbet/dynapp (Settings → Secrets and variables → Actions)." >&2
            if [ "$OPTIONAL" = true ]; then
              echo "Signing secrets are not configured; skipping publish so CI can stay green."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - id: compute
        if: steps.secrets.outputs.ready == 'true'
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          prev="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            next="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            next="${INPUT_VERSION#v}"
          elif [ -z "$prev" ]; then
            next="0.1.0"
          else
            base="${prev#v}"
            major="${base%%.*}"
            rest="${base#*.}"
            minor="${rest%%.*}"
            patch="${rest##*.}"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${prev:-<none>} -> agent $next"

  test:
    needs: version
    if: needs.version.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  create-release:
    needs: [version, test]
    if: needs.version.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DynApp Agent ${VERSION}" \
            --generate-notes

  binaries:
    needs: [version, create-release]
    if: needs.version.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build agent
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          asset="dynapp-shell-agent-${VERSION}-${GOOS}-${GOARCH}${suffix}"
          GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -X github.com/amitbet/dynapp-agent/shellagent.AgentVersion=${VERSION} -X github.com/amitbet/dynapp-agent/shellagent.AgentRepository=${REPOSITORY}" \
            -o "$asset" .
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_ENV"
      - name: Sign release asset
        env:
          PAINTJS_PAYLOAD_SIGNING_KEY: ${{ secrets.PAINTJS_PAYLOAD_SIGNING_KEY }}
        run: node scripts/sign-release-asset.mjs "$asset"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s "$asset.sig"
          gh release upload "v${VERSION}" "$asset" "$asset.sha256" "$asset.sig" --repo "$REPOSITORY" --clobber

  macos:
    needs: [version, create-release]
    if: needs.version.outputs.ready == 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore persistent macOS signing identity
        env:
          MACOS_CODESIGN_P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keys
          printf '%s' "$MACOS_CODESIGN_P12_BASE64" | base64 --decode > keys/macos-codesign.p12
          printf '%s' "$MACOS_CODESIGN_P12_PASSWORD" > keys/macos-codesign.pass
          chmod 600 keys/macos-codesign.p12 keys/macos-codesign.pass
      - name: Build and codesign agent
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset="dynapp-shell-agent-${VERSION}-darwin-${GOARCH}"
          GOOS=darwin GOARCH="$GOARCH" CGO_ENABLED=1 \
            go build -trimpath -ldflags="-s -w -X github.com/amitbet/dynapp-agent/shellagent.AgentVersion=${VERSION} -X github.com/amitbet/dynapp-agent/shellagent.AgentRepository=${REPOSITORY}" \
            -o "$asset" .
          MACOS_CODESIGN_IDENTIFIER="com.amitbet.dynapp.shell-agent" \
            node scripts/sign-macos-binary.mjs "$asset"
          codesign --verify --strict --verbose=2 "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_ENV"
      - name: Sign release asset
        env:
          PAINTJS_PAYLOAD_SIGNING_KEY: ${{ secrets.PAINTJS_PAYLOAD_SIGNING_KEY }}
        run: node scripts/sign-release-asset.mjs "$asset"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s "$asset.sig"
          gh release upload "v${VERSION}" "$asset" "$asset.sha256" "$asset.sig" --repo "$REPOSITORY" --clobber

  summary:
    needs: [version, binaries, macos]
    if: needs.version.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: List published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets \
            --jq '{tag:.tagName, url:.url, assets:[.assets[].name]}'
